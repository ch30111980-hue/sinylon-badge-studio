<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page introuvable — SINYLON Badge Studio Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background: #0f172a; color: #e2e8f0; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: sans-serif; }
        .error-card { text-align: center; padding: 3rem 2rem; }
        .error-code { font-size: 6rem; font-weight: 900; color: #f59e0b; line-height: 1; }
        .sinylon-logo { font-size: 1.1rem; font-weight: 700; letter-spacing: 2px; color: #94a3b8; margin-bottom: 2rem; }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="sinylon-logo">&#127959; SINYLON BADGE STUDIO PRO</div>
        <div class="error-code">404</div>
        <h4 class="mt-3 mb-2 fw-bold text-white">Page introuvable</h4>
        <p class="text-secondary mb-4">
            {% if message %}{{ message }}{% else %}La ressource demandée n'existe pas.{% endif %}
        </p>
        <a href="/" class="btn btn-warning fw-bold px-4">
            <i class="fas fa-home me-2"></i>Retour au Dashboard
        </a>
    </div>
</body>
</html>
