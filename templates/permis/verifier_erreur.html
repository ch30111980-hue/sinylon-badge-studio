{% extends "base.html" %}
{% block title %}Erreur de Vérification - SINYLON FIAT{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-0 p-5" style="border-radius: 20px;">
                <div class="mb-4">
                    <i class="fas fa-exclamation-triangle fa-5x text-danger animate__animated animate__shakeX"></i>
                </div>
                <h2 class="fw-bold text-dark">Document Non Reconnu</h2>
                <p class="text-muted mb-4">{{ message }}</p>
                <div class="alert alert-warning small">
                    <i class="fas fa-info-circle me-2"></i> 
                    Si vous pensez qu'il s'agit d'une erreur, veuillez contacter le département sécurité de l'usine.
                </div>
                <a href="{{ url_for('login_page') }}" class="btn btn-primary rounded-pill px-4 mt-3">
                    Retour à l'accueil
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
